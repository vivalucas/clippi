name: Build Windows

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            core/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('core/Cargo.lock') }}

      - name: Build Rust core library
        working-directory: core
        run: cargo build --release

      - name: Download ffmpeg
        run: .\scripts\download_ffmpeg.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: dotnet restore windows/Clippi/Clippi.csproj

      - name: Publish Windows app
        run: dotnet publish windows/Clippi/Clippi.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained -o build/

      - name: Bundle ffmpeg
        run: |
          New-Item -ItemType Directory -Force -Path build\ffmpeg | Out-Null
          Copy-Item -Path ffmpeg\windows-x64\ffmpeg.exe -Destination build\ffmpeg\ -Force
          Copy-Item -Path ffmpeg\windows-x64\ffprobe.exe -Destination build\ffmpeg\ -Force

      - name: Package Windows app
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build\* -DestinationPath dist\Clippi-windows.zip -Force

      - name: Install Inno Setup
        run: |
          # The bundled language file needs Inno Setup 6.5+; both 6.x and 7.x work.
          $min = [version]"6.5.0"
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } |
            Where-Object { (Get-Item $_).VersionInfo.FileVersion -ge $min } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y --force
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build installer and portable executables
        run: |
          $iscc = $env:ISCC
          # Prefer the tag version on release builds; otherwise keep the .iss default.
          $version = if ($env:GITHUB_REF_NAME -match '^v(\d+\.\d+\.\d+)$') { $Matches[1] } else { "" }
          # Pass absolute paths: Inno 6.x resolves relative [Files] sources
          # against its own working directory, unlike Inno 7.x.
          $common = @("/DSourcePath=$PWD\build", "/DDistPath=$PWD\dist")
          if ($version) { $common += "/DAppVersion=$version" }
          & $iscc @common installer\Clippi.iss
          & $iscc @common "/DPORTABLE" installer\Clippi.iss
          # Inno does not error when a wildcard matches nothing, so assert the
          # executables actually contain the app.
          foreach ($exe in "Clippi-Setup-x64.exe", "Clippi-Portable-x64.exe") {
            $size = (Get-Item "dist\$exe").Length
            if ($size -lt 20MB) { throw "$exe is only $size bytes - packaging step failed" }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clippi-windows
          path: dist/

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --title $env:GITHUB_REF_NAME --notes "Automated build for $env:GITHUB_REF_NAME"
          }
          gh release upload $env:GITHUB_REF_NAME dist\Clippi-windows.zip dist\Clippi-Setup-x64.exe dist\Clippi-Portable-x64.exe --clobber
